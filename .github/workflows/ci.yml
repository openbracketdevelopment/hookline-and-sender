name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.16"
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -m "not postgres" -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: hookline
          POSTGRES_PASSWORD: hookline
          POSTGRES_DB: hookline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookline -d hookline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hookline:hookline@localhost:5432/hookline
      TEST_DATABASE_URL: postgresql+psycopg://hookline:hookline@localhost:5432/hookline
      API_KEY: ci-api-key-with-more-than-thirty-two-characters
      DEMO_SIGNING_SECRET: ci-signing-key-with-more-than-thirty-two-characters
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.16"
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --locked alembic -c backend/migrations/alembic.ini upgrade head
      - run: uv run --locked pytest -m postgres -q
